name: Refresh visual snapshots

on: workflow_dispatch

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium with CI's fonts
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Regenerate the visual baselines
        run: bunx playwright test e2e/visual.e2e.ts --update-snapshots

      - name: Upload the baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: e2e/visual-snapshots/
